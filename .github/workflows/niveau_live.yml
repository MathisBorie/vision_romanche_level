# Image « en direct » du README : toutes les 15 min, dernière photo du bucket + niveau mesuré par DINOv2.
# Le résultat est poussé sur la branche `live` (un seul commit, écrasé à chaque fois : l'historique ne grossit pas).
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
name: Niveau en direct

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:          # bouton « Run workflow » : mise à jour immédiate

permissions:
  contents: write             # pousser la branche live
  actions: write              # se réactiver soi-même (anti-pause des 60 jours)

concurrency:
  group: niveau-live
  cancel-in-progress: false

env:
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  mettre-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la branche live (dernière mesure)
        run: |
          git fetch --depth=1 origin live:live 2>/dev/null && git worktree add sortie live || mkdir -p sortie

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Y a-t-il une nouvelle photo ?
        id: verif
        run: |
          pip install --quiet boto3
          python live/mettre_a_jour.py --verifier sortie ${{ github.event_name == 'workflow_dispatch' && '--forcer' || '' }}

      - name: Cache des poids
        if: steps.verif.outputs.nouvelle == 'true'
        uses: actions/cache@v4
        with:
          path: niveau_eau/poids
          key: poids-modeles-v1-sam-dinov2

      - name: Installer PyTorch (CPU), timm et transformers
        if: steps.verif.outputs.nouvelle == 'true'
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet timm transformers pandas pillow numpy opencv-python-headless

      - name: Mesurer et dessiner
        if: steps.verif.outputs.nouvelle == 'true'
        run: python live/mettre_a_jour.py sortie ${{ github.event_name == 'workflow_dispatch' && '--forcer' || '' }}

      - name: Publier sur la branche live
        if: steps.verif.outputs.nouvelle == 'true'
        run: |
          mkdir -p publication && cp sortie/niveau_live.jpg sortie/niveau_live.json sortie/historique.csv publication/
          cd publication
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Niveau en direct : $(python -c "import json; print(json.load(open('niveau_live.json'))['prise_utc'])")"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live

      - name: Garder la tâche active (évite la pause après 60 jours sans activité)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/niveau_live.yml/enable" || true
